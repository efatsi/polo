# Fly.io config for https://crozet-bike-polo.fly.dev
# Postgres: unmanaged Fly Postgres app "crozet-bike-polo-db", attached (sets DATABASE_URL).
app = "crozet-bike-polo"
primary_region = "iad"

[build]

[env]
  # Run Solid Queue (background jobs + the 15-minute groups.io sync) inside Puma.
  SOLID_QUEUE_IN_PUMA = "true"
  RAILS_LOG_TO_STDOUT = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running: the sync schedule lives in this process, so a stopped
  # machine means no syncing.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
